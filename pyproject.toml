[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl-lang-toolkit"
version = "0.4.0"
description = "SIPL (SImple Programming Language) toolkit: grammar, parser, AST, interpreter, trace, CLI and tree visualizations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["lark>=1.1,<2"]
keywords = ["sipl", "interpreter", "parser", "programming-theory", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Interpreters",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8", "build>=1", "twine>=5"]

[project.scripts]
sipl = "sipl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sipl = ["grammar/*.lark", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sipl"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP035"]

[tool.mypy]
python_version = "3.10"
files = ["src/sipl"]
ignore_missing_imports = true

